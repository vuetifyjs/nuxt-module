  vite: ^8.2.2
  vite-plugin-pwa: ^1.3.0
  vitepress: 2.0.0-alpha.19
  vitepress-plugin-llms: ^1.13.5
  vitest: ^4.1.11
  vue: ^3.5.41
  vue-tsc: ^3.3.11
  vuetify: ^4.2.0
  workbox-build: ^7.4.1
  workbox-window: ^7.4.1

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild

onlyBuiltDependencies:
  - sharp

shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lefthook: true
  sharp: true
minimumReleaseAgeExclude:
  - '@vuetify/v0@1.2.1'
  - vuetify@4.2.0
