  dayjs: ^1.11.23
  defu: ^6.1.7
  eslint: ^10.9.0
  eslint-config-vuetify: ^4.7.2
  lefthook: ^2.1.10
  local-pkg: ^1.2.1
  luxon: ^3.7.2
  markdown-it-task-lists: ^2.1.1
  moment: ^2.30.1
