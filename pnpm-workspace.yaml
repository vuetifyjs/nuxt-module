packages:
  - packages/*
  - apps/*
  - docs

catalog:
  '@antfu/eslint-config': ^7.7.3
  '@antfu/ni': ^28.3.0
  '@commitlint/cli': ^21.0.2
  '@commitlint/config-conventional': ^21.0.2
  '@commitlint/types': ^21.0.1
  '@date-io/date-fns': ^3.2.1
  '@date-io/date-fns-jalali': ^3.2.0
  '@date-io/dayjs': ^3.2.0
  '@date-io/hijri': ^3.2.0
  '@date-io/js-joda': ^3.2.0
  '@date-io/luxon': ^3.2.0
  '@date-io/moment': ^3.2.0
  '@fortawesome/fontawesome-svg-core': ^7.2.0
  '@fortawesome/free-solid-svg-icons': ^7.2.0
  '@fortawesome/vue-fontawesome': ^3.2.0
  '@iconify-json/carbon': ^1.2.23
  '@iconify-json/mdi': ^1.2.3
  '@js-joda/core': ^5.7.0
  '@js-joda/locale_en-us': ^4.15.3
  '@js-joda/locale_es': ^4.15.3
  '@mdi/js': ^7.4.47
  '@nuxt/devtools': latest
  '@nuxt/kit': ^4.5.1
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': ^4.5.1
  '@nuxt/test-utils': ^4.0.3
  '@nuxtjs/i18n': ^10.4.0
  '@parcel/watcher': ^2.5.6
  '@types/date-fns': ^2.6.3
  '@types/moment': ^2.13.0
  '@types/moment-hijri': ^2.1.4
  '@types/moment-jalaali': ^0.7.9
  '@types/node': ^25.9.3
  '@types/semver': ^7.7.1
  '@unocss/nuxt': ^66.7.2
  '@vite-pwa/assets-generator': ^1.0.2
  '@vite-pwa/vitepress': ^1.1.0
  '@vuetify/loader-shared': ^2.1.2
  '@vuetify/unplugin-styles': ^1.0.0-rc.1
  bumpp: ^11.1.0
  conventional-github-releaser: ^3.1.5
  date-fns: ^4.4.0
  date-fns-jalali: 2.19.0-2
  dayjs: ^1.11.21
  defu: ^6.1.7
  eslint: ^10.5.0
  eslint-config-vuetify: 4.3.5-beta.1
  lefthook: ^2.1.9
  local-pkg: ^1.2.1
  luxon: ^3.7.2
  markdown-it-task-lists: ^2.1.1
  moment: ^2.30.1
  moment-hijri: ^3.0.0
  moment-jalaali: 0.9.2
  nuxt: ^4.5.1
  pathe: ^2.0.3
  perfect-debounce: ^2.1.0
  playwright-core: ^1.61.0
  publint: ^0.3.21
  rimraf: ^6.1.3
  sass: ^1.101.0
  sass-embedded: ^1.100.0
  semver: ^7.8.4
  sitemap: ^9.0.1
  swetrix: ^4.4.0
  typescript: ^5.9.3
  ufo: ^1.6.4
  unconfig: ^7.5.0
  unocss: ^66.7.2
  vite: 7.3.5
  vite-plugin-pwa: ^1.3.0
  vitepress: 2.0.0-alpha.17
  vitepress-plugin-llms: ^1.13.1
  vitest: ^4.1.9
  vue: ^3.5.38
  vue-tsc: ^3.3.5
  vuetify: ^4.1.2
  workbox-build: ^7.4.1
  workbox-window: ^7.4.1

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

onlyBuiltDependencies:
  - sharp

shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
# exempt vite-plugin-checker from the release-age cooldown so 0.14.4 (PR #768) can be installed
minimumReleaseAgeExclude:
  - vite-plugin-checker
  - '@vuetify/unplugin-styles@1.0.0-rc.1'
overrides:
  '@vite-pwa/vitepress>vitepress': 'catalog:'
  vitepress: 'catalog:'
  # security: force patched versions of vulnerable transitive deps (same-major, safe)
  yaml: '^2.9.0'
  ws: '^8.21.0'
  tar: '^7.5.16'
  shell-quote: '^1.8.4'
  node-forge: '^1.4.0'
  lodash: '^4.18.1'
  nitropack: '^2.13.4'
  fast-uri: '^3.1.2'
  simple-git: '^3.36.0'
  flatted: '^3.4.2'
  postcss: '^8.5.15'
  '@babel/plugin-transform-modules-systemjs': '^7.29.7'
  picomatch@2: '^2.3.2'
  picomatch@4: '^4.0.4'
  brace-expansion@1: '^1.1.15'
  brace-expansion@2: '^2.1.1'
  brace-expansion@5: '^5.0.6'
  devalue@5: '^5.8.1'
  h3@1: '^1.15.11'
  webpack@5: '^5.107.2'
  # PR #768: 0.14.4 fixes a packaging regression (runtime component missing from tarball)
  vite-plugin-checker: '^0.14.4'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  sharp: true
